; Pairing replaces legacy bow speed/mass adjustments for recognized player bow+arrow
; combinations. These legacy settings still govern crossbows, unknown equipment,
; excluded special forms, and all bow shots when Pairing Enabled=false.
; Pairing does not alter native health damage, enchantments or durability.
[General]
Enabled=true
ObserveOnly=false
DiagnosticLogging=true
PlayerSpeedMult=1.25
PlayerCrossbowSpeedMult=1.25

[ArrowPhysics]
Enabled=true
MassInfluence=0.2

[Pairing]
Enabled=true
ReferenceSpeed=5000
VirtualBowMass=0.25
MaxSpeedRatio=1.25
CapacityLimits=true
MomentumImpact=true

; Explicit per-form numbers may override resolved, eligible catalogue equipment.
; Bad values retain a prior valid override; missing values use catalogue profiles.
; Safe ranges: bow power 0.1..8, mass 0.1..8, capacity Q 0.1..20.
[PairingBowPower]

[PairingAmmoMass]

[PairingAmmoCapacity]
